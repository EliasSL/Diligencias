    <script>
        // Global variables
        const SHEET_ID = '1DJQqFSIwicfitFIe4eIyATBatyJEfinhBfxQ9M6upTY';
        const API_URL = 'https://script.google.com/macros/s/AKfycbz3KQOgWNKcV667cVOHJSoGxmKYoYmMkh2mM-RGhGgjmLBG1AHYK7gp43cqknkuRFDY4A/exec';

        let currentVehicle = null;
let currentMonth = new Date().getMonth();
let currentYear = new Date().getFullYear();
let allData = [];
let vehicles = [];
let drivers = [];
let teams = [];
let vehicleAlerts = {};
// Controle de navegação entre telas
function showView(view, vehicle) {

}
// ============================================================
// NORMALIZAÇÃO DOS DADOS RECEBIDOS DA API
// ============================================================

function normalizeClientKey(key) {

    return String(key || '')
        .trim()
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/\s+/g, '_');
}


function normalizeDiligenciaData(item) {

    const normalized = {};

    Object.keys(item || {}).forEach(function(key) {

        const normalizedKey = normalizeClientKey(key);

        normalized[normalizedKey] = item[key];

    });

    return normalized;
}


function normalizeAllData(data) {

    return (data || []).map(function(item) {

        return normalizeDiligenciaData(item);

    });

}
// ============================================================
// CONVERSÃO SEGURA DE DATAS
// ============================================================

function parseClientDate(value) {

    if (!value) {
        return null;
    }

    // Já é uma data
    if (value instanceof Date) {
        return value;
    }

    const text = String(value).trim();

    // Formato dd/MM/yyyy
    const brMatch = text.match(
        /^(\d{2})\/(\d{2})\/(\d{4})$/
    );

    if (brMatch) {

        const day = Number(brMatch[1]);
        const month = Number(brMatch[2]) - 1;
        const year = Number(brMatch[3]);

        const date = new Date(
            year,
            month,
            day
        );

        if (!isNaN(date.getTime())) {
            return date;
        }
    }

    // Formato yyyy-MM-dd
    const isoDate = new Date(text);

    if (!isNaN(isoDate.getTime())) {
        return isoDate;
    }

    return null;
}
 function formatClientDate(value) {

    if (!value) {
        return '';
    }

    const date = parseClientDate(value);

    if (!date) {
        return '';
    }

    const day = String(date.getDate()).padStart(2, '0');
    const month = String(date.getMonth() + 1).padStart(2, '0');
    const year = date.getFullYear();

    return `${day}/${month}/${year}`;
}
function formatClientTime(value) {

    if (!value) {
        return '';
    }

    const text = String(value).trim();

    // Caso venha como ISO Date:
    // 1899-12-30T11:30:00.000Z
    const isoMatch = text.match(
        /T(\d{2}):(\d{2})/
    );

    if (isoMatch) {

        const hours = Number(isoMatch[1]);
        const minutes = Number(isoMatch[2]);

        return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
    }

    // Caso já venha como HH:mm:ss
    const timeMatch = text.match(
        /^(\d{1,2}):(\d{2})(?::\d{2})?$/
    );

    if (timeMatch) {

        const hours = Number(timeMatch[1]);
        const minutes = Number(timeMatch[2]);

        return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
    }

    return text;
}
       // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            updateDateTime();
            setInterval(updateDateTime, 1000);
            populateMonthSelect();
            loadDashboard();
        });

        function updateDateTime() {
            const now = new Date();
            const options = {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            };
            document.getElementById('currentDateTime').textContent = now.toLocaleDateString('pt-BR', options);
        }

        function populateMonthSelect() {
            const select = document.getElementById('monthSelect');
            const months = [
                'Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho',
                'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'
            ];

            // Get current month and year
            const now = new Date();
            const currentMonthIndex = now.getMonth();
            const currentYearNum = now.getFullYear();

            // Add months from current month going back 12 months
            for (let i = 0; i < 24; i++) {
                let monthIndex = (currentMonthIndex - i) % 12;
                let yearOffset = Math.floor((currentMonthIndex - i) / 12);
                let year = currentYearNum + yearOffset;
                if (monthIndex < 0) {
                    monthIndex += 12;
                    year -= 1;
                }
                const option = document.createElement('option');
                option.value = `${year}-${String(monthIndex + 1).padStart(2, '0')}`;
                option.textContent = `${months[monthIndex]} ${year}`;
                select.appendChild(option);
                if (i === 0) {
                    option.selected = true;
                    currentMonth = monthIndex;
                    currentYear = year;
                }
            }
        }

        function loadDashboard() {
            const select = document.getElementById('monthSelect');
            const [year, month] = select.value.split('-').map(Number);
            currentMonth = month - 1;
            currentYear = year;

            showLoading(true);
            fetchData(month, year);
        }

        function fetchData(month, year) {
            const url = `${API_URL}?action=getData&month=${month}&year=${year}`;

            fetch(url)
                .then(response => response.json())
                .then(data => {

    if (!data.success) {
        throw new Error(data.error || 'Erro retornado pela API.');
    }

    // Normaliza os nomes das colunas recebidas da planilha
    allData = normalizeAllData(data.diligences || []);

    // Recebe os veículos diretamente da aba "veículos"
    vehicles = data.vehicles || [];

    // Recebe condutores e equipes
drivers = data.drivers || [];

        function applyVehicleFilters() {
    // Obtém o veículo atual do título do modal
    const title = document.getElementById('modalTitle').textContent;
    const vehicleMatch = title.match(/Diligências - (.+)/);
    const vehicle = vehicleMatch ? vehicleMatch[1] : currentVehicle;
    
    const dateFilter = document.getElementById('filterDate')?.value || '';
    const conductorFilter = document.getElementById('filterConductor')?.value?.toUpperCase() || '';
    const diligenciaFilter = document.getElementById('filterDiligencia')?.value || '';

    let filtered = allData.filter(item =>
        item.veiculo && String(item.veiculo).trim().toUpperCase() === String(vehicle).trim().toUpperCase()
    );

    if (dateFilter) {
        const filterDateObj = parseClientDate(dateFilter);
        filtered = filtered.filter(item => {
            if (!item.data_inicio) return false;
            const itemDate = parseClientDate(item.data_inicio);
            if (!itemDate || !filterDateObj) return false;
            return (
                itemDate.getFullYear() === filterDateObj.getFullYear() &&
                itemDate.getMonth() === filterDateObj.getMonth() &&
                itemDate.getDate() === filterDateObj.getDate()
            );
        });
    }

    if (conductorFilter) {
        filtered = filtered.filter(item =>
            item.condutor && item.condutor.toUpperCase().includes(conductorFilter)
        );
    }

    if (diligenciaFilter) {
        filtered = filtered.filter(item =>
            item.diligencia && item.diligencia.toUpperCase() === diligenciaFilter
        );
    }

    const container = document.getElementById('filteredList');
    if (!container) return;
    
    if (filtered.length === 0) {
        container.innerHTML = `<p style="color:#999;padding:20px;text-align:center;">Nenhuma diligência encontrada com os filtros aplicados.</p>`;
    } else {
        container.innerHTML = buildTableHtml(filtered);
    }
}

</select>

                        </div>
                        <div class="form-group full-width">
                            <label>Motivo</label>
                            <input type="text" id="f_motivo">
                        </div>
                        <div class="form-group full-width">
                            <label>Observação</label>
                            <textarea id="f_observacao"></textarea>
                        </div>
                        <div class="form-group">
                            <label>Data Final</label>
                            <input type="text" id="f_data_final" value="${dateStr}">
                        </div>
                        <div class="form-group">
                            <label>Hora Final</label>
                            <input type="text" id="f_hora_final" value="${timeStr}">
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-cancel" onclick="closeModal()">Cancelar</button>
                        <button type="button" class="btn btn-pending" onclick="saveDiligencia('PENDENTE')">📌 Pendente</button>
                        <button type="button" class="btn btn-finish" onclick="saveDiligencia('FINALIZADO')">✅ Finalizar Diligência</button>
                    </div>
                </form>
            `;

            // Populate select options
            drivers.forEach(driver => {
                const opt = document.createElement('option');
                opt.value = driver;
                opt.textContent = driver;
                document.getElementById('f_condutor').appendChild(opt);
            });

            teams.forEach(team => {
                const opt = document.createElement('option');
                opt.value = team;
                opt.textContent = team;
                document.getElementById('f_equipe').appendChild(opt);
            });

            // Show "outra" input when "outra" is selected or custom option
            document.getElementById('f_diligencia').addEventListener('change', function() {
                const outraInput = document.getElementById('f_diligencia_outra');
                if (this.value === 'OUTRA') {

    outraInput.style.display = 'block';
    outraInput.focus();

} else {

    outraInput.style.display = 'none';
    outraInput.value = '';

}
            });

            // Auto calculate km total
            document.getElementById('f_km_inicial').addEventListener('input', calculateKmTotal);
            document.getElementById('f_km_final').addEventListener('input', calculateKmTotal);

            // Check km difference
            document.getElementById('f_km_inicial').addEventListener('blur', function() {
                const ultimoKm = parseFloat(document.getElementById('f_ultimo_km').value) || 0;
                const kmInicial = parseFloat(this.value) || 0;
                if (kmInicial !== ultimoKm && kmInicial > 0) {
                    if (confirm('⚠️ Km diferente do último registro. Deseja continuar?')) {
                        // Continue - will be logged on save
                    } else {
                        this.value = ultimoKm;
                    }
                }
            });

            document.getElementById('f_km_final').addEventListener('blur', function() {
                const kmInicial = parseFloat(document.getElementById('f_km_inicial').value) || 0;
                const kmFinal = parseFloat(this.value) || 0;
                if (kmFinal <= kmInicial && kmFinal > 0) {
                    showToast('Km final deve ser maior que Km inicial!', 'error');
                    this.value = '';
                }
            });

            calculateKmTotal();
        }

        function calculateKmTotal() {
            const kmInicial = parseFloat(document.getElementById('f_km_inicial').value) || 0;
            const kmFinal = parseFloat(document.getElementById('f_km_final').value) || 0;
            const total = kmFinal - kmInicial;
            document.getElementById('f_km_total').value = total >= 0 ? total.toFixed(2) : '';
        }

        function saveDiligencia(status) {
            const form = document.getElementById('diligenciaForm');
            if (!form) return;

            const data = {
                data_inicio: document.getElementById('f_data_inicio').value,
                hora_inicio: document.getElementById('f_hora_inicio').value,
                ultimo_km: parseFloat(document.getElementById('f_ultimo_km').value) || 0,
                km_inicial: parseFloat(document.getElementById('f_km_inicial').value) || 0,
                km_final: parseFloat(document.getElementById('f_km_final').value) || 0,
                km_total: parseFloat(document.getElementById('f_km_total').value) || 0,
                veiculo: document.getElementById('f_veiculo').value,
                condutor: document.getElementById('f_condutor').value,
                equipe: document.getElementById('f_equipe').value,
                diligencia:
    document.getElementById('f_diligencia').value === 'OUTRA'
        ? document.getElementById('f_diligencia_outra').value.trim()
        : document.getElementById('f_diligencia').value,
                motivo: document.getElementById('f_motivo').value,
                observacao: document.getElementById('f_observacao').value,
                data_final: document.getElementById('f_data_final').value,
                hora_final: document.getElementById('f_hora_final').value,
                status: status
            };

            // Validation for FINALIZADO
            if (status === 'FINALIZADO') {
                const required = ['data_inicio', 'hora_inicio', 'km_inicial', 'km_final', 'condutor', 'equipe', 'diligencia'];
                let missing = required.filter(field => !data[field] || data[field] === '');
                if (missing.length > 0) {
                    showToast(`Preencha os campos: ${missing.join(', ')}`, 'error');
                    return;
                }

                if (data.km_final <= data.km_inicial) {
                    showToast('Km final deve ser maior que Km inicial!', 'error');
                    return;
                }

                // Check if km_inicial differs from ultimo_km
                if (data.km_inicial !== data.ultimo_km && data.km_inicial > 0) {
                    // Will be logged in audit
                    showToast('⚠️ Km diferente do último registro. Auditoria será registrada.', 'warning');
                }
            }

            // Save to sheet via API
            showLoading(true);
            const url = `${API_URL}?action=saveDiligencia`;

            fetch(url, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(data)
            })
            .then(() => {
                showLoading(false);
                showToast(`Diligência ${status === 'FINALIZADO' ? 'finalizada' : 'salva como pendente'} com sucesso!`, 'success');
                closeModal();
                loadDashboard();
            })
            .catch(error => {
                showLoading(false);
                showToast('Erro ao salvar diligência', 'error');
                console.error('Error:', error);
            });
        }

        function editDiligencia(linha) {
            const item = allData.find(d => d.linha === linha);
            if (!item) {
                showToast('Registro não encontrado', 'error');
                return;
            }

            document.getElementById('modalTitle').textContent = `✏️ Editar Diligência`;
            document.getElementById('modalBody').innerHTML = `
                <form id="editForm" onsubmit="return false;">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Data Início</label>
                            <input type="text" id="e_data_inicio" value="${formatClientDate(item.data_inicio)}" readonly>
                        </div>
                        <div class="form-group">
                            <label>Hora Início</label>
                            <input type="text" id="e_hora_inicio" value="${formatClientTime(item.hora_inicio)}" readonly>
                        </div>
                        <div class="form-group">
                            <label>Km Inicial</label>
                            <input type="number" id="e_km_inicial" value="${item.km_inicial || 0}" step="0.01">
                        </div>
                        <div class="form-group">
                            <label>Km Final</label>
                            <input type="number" id="e_km_final" value="${item.km_final || 0}" step="0.01">
                        </div>
                        <div class="form-group">
                            <label>Condutor</label>
                            <select id="e_condutor">
                                ${drivers.map(d => `<option value="${d}" ${d === item.condutor ? 'selected' : ''}>${d}</option>`).join('')}
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Equipe</label>
                            <select id="e_equipe">
                                ${teams.map(t => `<option value="${t}" ${t === item.equipe ? 'selected' : ''}>${t}</option>`).join('')}
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Diligência</label>
                            <select id="e_diligencia">
    <option value="BO" ${item.diligencia === 'BO' ? 'selected' : ''}>BO</option>
    <option value="OM" ${item.diligencia === 'OM' ? 'selected' : ''}>OM</option>
    <option value="IP" ${item.diligencia === 'IP' ? 'selected' : ''}>IP</option>
    <option value="APF" ${item.diligencia === 'APF' ? 'selected' : ''}>APF</option>
    <option value="INTIMAÇÃO" ${item.diligencia === 'INTIMAÇÃO' ? 'selected' : ''}>INTIMAÇÃO</option>
    <option value="MANDADO DE PRISÃO" ${item.diligencia === 'MANDADO DE PRISÃO' ? 'selected' : ''}>MANDADO DE PRISÃO</option>
    <option value="BUSCA E APREENSÃO" ${item.diligencia === 'BUSCA E APREENSÃO' ? 'selected' : ''}>BUSCA E APREENSÃO</option>
    <option value="ECD" ${item.diligencia === 'ECD' ? 'selected' : ''}>ECD</option>
    <option value="LOCAL DE CRIME" ${item.diligencia === 'LOCAL DE CRIME' ? 'selected' : ''}>LOCAL DE CRIME</option>
    <option value="OUTRA" ${![
        'BO',
        'OM',
        'IP',
        'APF',
        'INTIMAÇÃO',
        'MANDADO DE PRISÃO',
        'BUSCA E APREENSÃO',
        'ECD',
        'LOCAL DE CRIME'
    ].includes(item.diligencia) ? 'selected' : ''}>OUTRA</option>
</select>

<input
    type="text"
    id="e_diligencia_outra"
    placeholder="Outra diligência..."
    value="${![
        'BO',
        'OM',
        'IP',
        'APF',
        'INTIMAÇÃO',
        'MANDADO DE PRISÃO',
        'BUSCA E APREENSÃO',
        'ECD',
        'LOCAL DE CRIME'
    ].includes(item.diligencia) ? item.diligencia : ''}"
    style="margin-top:5px;display:${
        ![
            'BO',
            'OM',
            'IP',
            'APF',
            'INTIMAÇÃO',
            'MANDADO DE PRISÃO',
            'BUSCA E APREENSÃO',
            'ECD',
            'LOCAL DE CRIME'
        ].includes(item.diligencia) ? 'block' : 'none'
    };">
                            </select>
                        </div>
                        <div class="form-group full-width">
                            <label>Motivo</label>
                            <input type="text" id="e_motivo" value="${item.motivo || ''}">
                        </div>
                        <div class="form-group full-width">
                            <label>Observação</label>
                            <textarea id="e_observacao">${item.observacao || ''}</textarea>
                        </div>
                        <div class="form-group">
                            <label>Data Final</label>
<input type="text" id="e_data_final" value="${formatClientDate(item.data_final)}">
                        </div>
                        <div class="form-group">
                            <label>Hora Final</label>
                            <input type="text" id="e_hora_final" value="${formatClientTime(item.hora_final)}">
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-cancel" onclick="closeModal()">Cancelar</button>
                        ${item.status_diligencia === 'PENDENTE' ? 
                            `<button type="button" class="btn btn-finish" onclick="updateDiligencia(${linha}, 'FINALIZADO')">✅ Finalizar Diligência</button>` :
                            `<button type="button" class="btn btn-finish" onclick="updateDiligencia(${linha}, 'FINALIZADO')">💾 Atualizar</button>`
                        }
                    </div>
                </form>
            `;

            // Enable km fields validation
            document.getElementById('e_km_final').addEventListener('blur', function() {
                const kmInicial = parseFloat(document.getElementById('e_km_inicial').value) || 0;
                const kmFinal = parseFloat(this.value) || 0;
                if (kmFinal <= kmInicial && kmFinal > 0) {
                    showToast('Km final deve ser maior que Km inicial!', 'error');
                    this.value = '';
                }
            });
        document.getElementById('e_diligencia').addEventListener('change', function() {

    const outraInput = document.getElementById('e_diligencia_outra');

    if (this.value === 'OUTRA') {

        outraInput.style.display = 'block';
        outraInput.focus();

    } else {

        outraInput.style.display = 'none';
        outraInput.value = '';

    }

});
}

        function updateDiligencia(linha, status) {
            const item = allData.find(d => d.linha === linha);
            if (!item) {
                showToast('Registro não encontrado', 'error');
                return;
            }

            const data = {
                linha: linha,
                data_inicio: document.getElementById('e_data_inicio').value,
                hora_inicio: document.getElementById('e_hora_inicio').value,
                km_inicial: parseFloat(document.getElementById('e_km_inicial').value) || 0,
                km_final: parseFloat(document.getElementById('e_km_final').value) || 0,
                condutor: document.getElementById('e_condutor').value,
                equipe: document.getElementById('e_equipe').value,
                diligencia:
    document.getElementById('e_diligencia').value === 'OUTRA'
        ? document.getElementById('e_diligencia_outra').value.trim()
        : document.getElementById('e_diligencia').value,
                motivo: document.getElementById('e_motivo').value,
                observacao: document.getElementById('e_observacao').value,
                data_final: document.getElementById('e_data_final').value,
                hora_final: document.getElementById('e_hora_final').value,
                status: status,
                veiculo: item.veiculo,
                ultimo_km: item.ultimo_km || 0
            };

            // Validation
            if (status === 'FINALIZADO') {
                const required = ['data_inicio', 'hora_inicio', 'km_inicial', 'km_final', 'condutor', 'equipe', 'diligencia'];
                let missing = required.filter(field => !data[field] || data[field] === '');
                if (missing.length > 0) {
                    showToast(`Preencha os campos: ${missing.join(', ')}`, 'error');
                    return;
                }

                if (data.km_final <= data.km_inicial) {
                    showToast('Km final deve ser maior que Km inicial!', 'error');
                    return;
                }
            }

            showLoading(true);
            const url = `${API_URL}?action=updateDiligencia`;

            fetch(url, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(data)
            })
            .then(() => {
                showLoading(false);
                showToast('Diligência atualizada com sucesso!', 'success');
                closeModal();
                loadDashboard();
            })
            .catch(error => {
                showLoading(false);
                showToast('Erro ao atualizar diligência', 'error');
                console.error('Error:', error);
            });
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            container.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.5s';
                setTimeout(() => toast.remove(), 500);
            }, 5000);
        }

        function showLoading(show) {
            const container = document.getElementById('cardsContainer');
            if (show) {
                container.innerHTML = '<div class="loading">Carregando dados...</div>';
            }
        }

        // Click outside modal to close
        document.getElementById('modalOverlay').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });
    </script>
</body>
</html>
